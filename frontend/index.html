<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер расходов</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Трекер расходов</h1>
            <p class="subtitle">Личный учёт трат</p>
        </header>

        <section class="card">
            <h2 id="form-title">Новая запись</h2>
            <form id="expense-form">
                <input type="hidden" id="expense-id">
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Сумма, ₽</label>
                        <input type="number" id="amount" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Категория</label>
                        <input type="text" id="category" maxlength="64" required
                               placeholder="еда, транспорт, развлечения…">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="expense_date">Дата траты</label>
                        <input type="date" id="expense_date" required>
                    </div>
                    <div class="form-group form-group-wide">
                        <label for="note">Комментарий</label>
                        <input type="text" id="note" maxlength="1000" placeholder="не обязательно">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="btn btn-primary">Добавить</button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary" hidden>Отмена</button>
                </div>
                <p id="form-error" class="error" hidden></p>
            </form>
        </section>

        <section class="card">
            <h2>Фильтры</h2>
            <form id="filter-form" class="filter-form">
                <div class="form-group">
                    <label for="filter-category">Категория</label>
                    <input type="text" id="filter-category" placeholder="все">
                </div>
                <div class="form-group">
                    <label for="filter-date-from">С</label>
                    <input type="date" id="filter-date-from">
                </div>
                <div class="form-group">
                    <label for="filter-date-to">По</label>
                    <input type="date" id="filter-date-to">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Применить</button>
                    <button type="button" id="filter-reset" class="btn btn-secondary">Сбросить</button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="list-header">
                <h2>Записи</h2>
                <div class="totals">
                    <span>Записей: <strong id="total-count">0</strong></span>
                    <span>На сумму: <strong id="total-amount">0,00 ₽</strong></span>
                </div>
            </div>
            <div id="expense-list" class="expense-list">
                <p class="empty">Записей пока нет</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
